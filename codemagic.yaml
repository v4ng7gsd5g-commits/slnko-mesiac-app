workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 15
    scripts:
      - name: Build for Simulator
        script: | 
          flutter pub get
          # Flutter si sám zavolá pod install, ak je Podfile v poriadku
          flutter build ios --simulator --debug
          
          # Presun výsledku pre stiahnutie
          mkdir -p build/ios/iphoneos
          cp -R build/ios/iphonesimulator/Runner.app build/ios/iphoneos/
     
    artifacts:
      - build/ios/iphoneos/*.app
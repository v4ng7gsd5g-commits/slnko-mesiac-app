workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    scripts:
      - name: Build for iOS Device
        script: | 
          flutter pub get
          # 1. Vyčistíme projekt
          flutter clean
          # 2. Postavíme aplikáciu pre simulátor (nevyžaduje Development Team)
          flutter build ios --release --simulator --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
      - build/ios/iphonesimulator/Runner.app
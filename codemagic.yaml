workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 15
    scripts:
      - name: Build for iOS Device
        script: | 
          flutter pub get
          # Prepnutie na ostrý build pre iPhone (ARM procesor)
          flutter build ios --release --no-codesign
          
          # Príprava pre Artifacts
          mkdir -p build/ios/iphoneos
          # Pri --release builde je Runner.app v iphoneos priečinku
     
    artifacts:
      - build/ios/iphoneos/*.app
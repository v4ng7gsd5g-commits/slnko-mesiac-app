workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 15
    scripts:
      - name: Build for iOS Device
        script: | 
          flutter pub get
          # Prepnutie na build pre reálny iPhone bez certifikátov
          flutter build ios --release --no-codesign
          
          # Vytvoríme priečinok, ktorý Codemagic očakáva pre Artifacts
          mkdir -p build/ios/iphoneos
          # Runner.app sa pri tomto type buildu už nachádza v správnom priečinku
     
    artifacts:
      - build/ios/iphoneos/*.app
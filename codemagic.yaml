workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    scripts:
      - name: Build for iOS Device
        script: | 
          flutter pub get
          # Vygenerujeme nepodpísaný IPA archív, čo je stabilnejšia metóda pre cloud
          flutter build ipa --release --no-codesign --build-number=1 --build-name=1.0.0
    artifacts:
      - build/ios/ipa/*.ipa
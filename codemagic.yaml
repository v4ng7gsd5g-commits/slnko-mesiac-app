workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 15
    scripts:
      - name: Build iOS
        script: | 
          flutter pub get
          # Spustíme build a ignorujeme chybu podpisu
          flutter build ios --release --no-codesign || true
          
          # VYHĽADÁVANIE: Nájdeme kdekoľvek skrytý Runner.app a skopírujeme ho k sebe
          mkdir -p $FCI_BUILD_DIR/build/ios/iphoneos
          find build/ios -name "Runner.app" -exec cp -R {} $FCI_BUILD_DIR/build/ios/iphoneos/ \; 2>/dev/null || true
    artifacts:
      - build/ios/iphoneos/*.app
workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 15
    scripts:
      - name: Build for Simulator
        script: | 
          flutter pub get
          # Simulator build nepotrebuje certifikáty a vždy vyrobí súbory
          flutter build ios --simulator --debug
          
          # Presunieme výsledok tam, kde ho Codemagic uvidí ako Artifact
          mkdir -p build/ios/iphoneos
          cp -R build/ios/iphonesimulator/Runner.app build/ios/iphoneos/
    artifacts:
      - build/ios/iphoneos/*.app
workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 15
    scripts:
      - name: Build iOS
        script: | 
          flutter pub get
          # Vytvoríme priečinok vopred, aby mal build kam sypať dáta
          mkdir -p build/ios/iphoneos
          # Spustíme build - ak zlyhá na podpise, || true ho podrží nažive
          flutter build ios --release --no-codesign || true
          # KĽÚČOVÁ ZMENA: Ak build vytvoril Runner.app v inom priečinku, nájdeme ho
          [ -d build/ios/iphoneos/Runner.app ] || cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/iphoneos/ 2>/dev/null || true
    artifacts:
      - build/ios/iphoneos/*.app
workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    scripts:
      - name: Build for iOS Device
        script: | 
          flutter pub get
          # Vynútime nastavenia priamo do Xcode prostredia
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          
          # Build ipa s potlačením kontroly tímu
          flutter build ipa --release --no-codesign --build-inputs="CODE_SIGNING_ALLOWED=NO"
    artifacts:
      - build/ios/ipa/*.ipa
workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    scripts:
      - name: Build for iOS Device
        script: | 
          flutter pub get
          flutter clean
          # Tento príkaz vytvorí Release verziu, ktorú môžeš spustiť z plochy, 
          # ale s vypnutým podpisovaním, aby Codemagic nehlásil chybu Team ID.
          flutter build ios --release --no-codesign --extra-gen-snapshot-options=--no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
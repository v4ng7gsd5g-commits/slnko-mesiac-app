workflows:
  default-workflow:
    # ... ostatné nastavenia ...
    scripts:
      - name: Build for iOS Device
        script: | 
          flutter pub get
          # 1. Postavíme iOS bez podpisu
          flutter build ios --release --no-codesign
          # 2. Manuálne povieme Xcode, aby ignoroval podpisovanie pri balení
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
    artifacts:
      - build/ios/iphoneos/*.app
workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 15
    scripts:
      - name: Build for Simulator
        script: | 
          flutter pub get
          cd ios
          # Tieto dva príkazy vynútia prepojenie kamery
          rm -rf Pods
          rm -f Podfile.lock
          pod install --repo-update
          cd ..
          flutter build ios --simulator --debug
          mkdir -p build/ios/iphoneos
          cp -R build/ios/iphonesimulator/Runner.app build/ios/iphoneos/
    artifacts:
      - build/ios/iphoneos/*.app
workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    scripts:
      - name: Build for iOS Device
        script: | 
          flutter pub get
          flutter clean
          
          # 1. Pripravíme Flutter súbory (toto vytvorí potrebné frameworky)
          flutter build ios --release --no-codesign
          
          # 2. Zavoláme priamo Xcode kompilátor s vynúteným ignorovaním podpisu
          # Toto je kľúčový krok, ktorý obíde požiadavku na Development Team
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
    artifacts:
      - build/ios/iphoneos/Runner.app
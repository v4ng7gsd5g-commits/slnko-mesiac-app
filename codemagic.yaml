workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    scripts:
      - name: Build for iOS Device
        script: | 
          flutter pub get
          flutter clean
          # Tento príkaz natvrdo prepíše požiadavky Xcode počas kompilácie
          flutter build ios --release --no-codesign \
            --extra-front-end-options=--no-track-widget-creation \
            --extra-gen-snapshot-options=--no-codesign \
            --build-inputs="CODE_SIGNING_ALLOWED=NO,CODE_SIGNING_REQUIRED=NO,CODE_SIGN_IDENTITY='',DEVELOPMENT_TEAM=''"
    artifacts:
      - build/ios/iphoneos/Runner.app
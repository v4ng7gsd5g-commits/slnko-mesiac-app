workflows:
  default-workflow:
    name: Default Workflow
    artifacts:
      - $FCI_BUILD_DIR/build/ios/iphoneos/*.app
    scripts:
      - name: Build iOS
        script: | 
          flutter pub get
          # Tento príkaz vytvorí súbory, aj keď skončí chybou podpisu
          flutter build ios --release --no-codesign || true
        ignore_failure: true
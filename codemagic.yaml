workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 10
    scripts:
      - name: Build iOS
        script: | 
          flutter pub get
          # Vynútime build a ignorujeme chybu podpisu
          flutter build ios --release --no-codesign || true
          # Ručne skopírujeme výsledok tam, kde ho Codemagic uvidí
          mkdir -p build/ios/iphoneos/Runner.app
          cp -R ios/Runner.xcworkspace build/ios/iphoneos/ 2>/dev/null || true
    artifacts:
      - build/ios/iphoneos/*.app
workflows:
  default-workflow:
    # ... ostatné nastavenia ...
    scripts:
      - name: Build for iOS Device
        script: | 
          flutter pub get
          # Tento príkaz zakáže Xcode hľadať tím a profily
          flutter build ios --release --no-codesign --extra-gen-snapshot-options=--no-codesign --build-number=1 --build-name=1.0.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
    artifacts:
      - build/ios/iphoneos/*.app
workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    scripts:
      - name: Build for iOS Device
        script: | 
          flutter pub get
          # 1. Nastavíme globálne pravidlá pre Xcode, aby nepýtal podpis
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""

          # 2. Samotný build IPA bez akýchkoľvek extra parametrov, ktoré by hádzali chybu
          flutter build ipa --release --no-codesign --build-number=1 --build-name=1.0.0
    artifacts:
      - build/ios/ipa/*.ipa
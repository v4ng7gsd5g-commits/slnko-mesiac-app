workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 15
    scripts:
      - name: Build for iOS Device
        script: | 
          flutter pub get
          # Ostrý build pre reálny iPhone procesor
          flutter build ios --release --no-codesign
          
    artifacts:
      # TOTO JE ZMENA: Smerujeme tam, kde flutter build ios ukladá výsledok
      - build/ios/iphoneos/*.app
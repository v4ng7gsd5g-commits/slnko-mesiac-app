name: moja_prva_appka
description: "AR aplikacia na vymenu slnka za mesiac."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Presne verzie bez striešky (^), aby sme zabránili konfliktom v cloude
  camera: 0.11.0+1
  geolocator: 13.0.1
  apsl_sun_calc: 0.0.4
  motion_sensors: ^0.1.0  # Zmena podľa odporúčania terminálu
  cupertino_icons: 1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0

flutter:
  uses-material-design: true